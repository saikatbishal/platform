<!-- @dsCard group="Type" viewport="700x150" name="Labels" subtitle="11px uppercase at 0.14em — the app's most-used style" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
.l{font-size:var(--text-label);font-weight:600;letter-spacing:var(--tracking-label);text-transform:uppercase;line-height:1}</style></head><body>
<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center">
<span class="l" style="color:var(--ink)">Log a journey</span>
<span class="l" style="color:var(--ink-soft)">Milestones</span>
<span class="l" style="color:var(--ink-faint)">Kilometres</span>
<span class="l" style="color:var(--accent)">Change</span>
</div>
<p style="margin:14px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">11px is the bottom step and nothing goes below it. It stays legible because it is uppercase and tracked — the 9.6px labels this replaced were not.</p>
</body></html>
