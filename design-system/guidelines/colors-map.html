<!-- @dsCard group="Colors" viewport="700x150" name="Map surfaces" subtitle="Land is the page, not a card" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body><div class="sw">
<div style="background:var(--land)"><span class="n" style="color:var(--ink)">land</span><span class="h" style="color:var(--ink)">#0C2140</span></div>
<div style="background:var(--land-visited)"><span class="n" style="color:var(--ink)">land-visited</span><span class="h" style="color:var(--ink)">#1E4A73</span></div>
<div style="background:var(--dot)"><span class="n" style="color:#0A1C33">dot · station field</span><span class="h" style="color:#0A1C33">#7E93A6</span></div>
<div style="background:var(--sea)"><span class="n" style="color:var(--sea-ink)">sea</span><span class="h" style="color:var(--sea-ink)">#081D2B</span></div>
<div style="background:var(--sea-ink)"><span class="n" style="color:#081D2B">sea-ink</span><span class="h" style="color:#081D2B">#4D7A8C</span></div>
</div></body></html>
