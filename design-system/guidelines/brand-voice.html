<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
table{border-collapse:collapse;width:100%;font-size:12px}td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
td:first-child{width:40%;color:var(--vermillion)}td:last-child{color:var(--ink)}
th{text-align:left;padding:0 10px 6px;font-size:var(--text-label);font-weight:600;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-faint)}</style></head><body>
<table>
<tr><th>Not this</th><th>This</th></tr>
<tr><td>No trains found.</td><td>No through train in the timetable. The route will be drawn as the shortest path instead.</td></tr>
<tr><td>Enter a note…</td><td>Overnight, top bunk.</td></tr>
<tr><td>Sign in to continue</td><td>Your rail life, on one map.</td></tr>
<tr><td>Achievement unlocked! 🎉</td><td>4,182 km — past 1,000</td></tr>
</table></body></html>
