<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}

</style></head><body>
<div style="font-family:var(--font-body);display:flex;flex-direction:column;gap:6px">
<div style="font-size:var(--text-xl)">प्लेटफ़ॉर्म</div>
<div style="font-size:var(--text-xl);font-weight:800;letter-spacing:var(--tracking-board);text-transform:uppercase">Platform</div>
<div style="font-size:var(--text-xl)">প্ল্যাটফর্ম</div>
</div>
<p style="margin:12px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">Both text stacks list the script faces after Archivo rather than switching stack per element — a browser resolves a stack per character. Real boards carry Devanagari, Latin, then the state language, in that order.</p>
