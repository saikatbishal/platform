<!-- @dsCard group="Spacing" viewport="700x160" name="Radius" subtitle="Signage is nearly square — four values, no more" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
.b{display:flex;gap:16px}.k{width:110px;height:66px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}</style></head><body>
<div class="b">
<div class="k" style="border-radius:var(--radius-hair)">hair · 2px</div>
<div class="k" style="border-radius:var(--radius-sm)">sm · 4px</div>
<div class="k" style="border-radius:var(--radius-sheet)">sheet · 8px</div>
<div class="k" style="border-radius:var(--radius-round);width:66px">round</div>
</div>
<p style="margin:12px 0 0;font-size:12px;color:var(--ink-soft)">Nothing is pill-shaped except the avatar. Radii nest concentrically: outer 2px, border 1px, inner 1px.</p>
</body></html>
