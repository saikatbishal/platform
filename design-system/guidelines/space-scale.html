<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px steps; 8px is the default gap, 20px a sheet's padding" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
.b{display:flex;align-items:flex-end;gap:12px}.c{text-align:center}.bar{background:var(--accent);height:14px;border-radius:1px}
.t{margin-top:6px;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}</style></head><body>
<div class="b">
<div class="c"><div class="bar" style="width:4px"></div><div class="t">1 · 4</div></div><div class="c"><div class="bar" style="width:8px"></div><div class="t">2 · 8</div></div><div class="c"><div class="bar" style="width:12px"></div><div class="t">3 · 12</div></div><div class="c"><div class="bar" style="width:16px"></div><div class="t">4 · 16</div></div><div class="c"><div class="bar" style="width:20px"></div><div class="t">5 · 20</div></div><div class="c"><div class="bar" style="width:24px"></div><div class="t">6 · 24</div></div><div class="c"><div class="bar" style="width:32px"></div><div class="t">8 · 32</div></div><div class="c"><div class="bar" style="width:48px"></div><div class="t">12 · 48</div></div>
</div></body></html>
