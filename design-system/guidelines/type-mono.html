<!-- @dsCard group="Type" viewport="700x170" name="Figures — IBM Plex Mono" subtitle="Tabular by design, so a counting number cannot jitter" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body>
<div style="display:flex;gap:36px;align-items:flex-end">
<div><div class="tabular" style="font-size:var(--text-2xl);line-height:1;color:var(--cream)">4,182</div><div style="margin-top:7px;font-size:var(--text-label);font-weight:600;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-faint)">Kilometres</div></div>
<div><div class="tabular" style="font-size:var(--text-2xl);line-height:1;color:var(--cream)">21</div><div style="margin-top:7px;font-size:var(--text-label);font-weight:600;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--ink-faint)">Stations</div></div>
<div style="display:flex;gap:10px;align-items:center">
<span class="tabular" style="font-size:var(--text-sm);letter-spacing:var(--tracking-code);color:var(--accent)">HWH</span>
<span class="tabular" style="font-size:var(--text-sm);letter-spacing:var(--tracking-code);color:var(--accent)">KPD</span>
<span class="tabular" style="font-size:var(--text-sm);letter-spacing:var(--tracking-code);color:var(--accent)">12860</span>
</div>
</div>
<p style="margin:14px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">Cream at 30px is right; cream at 14px is mud. Station codes get <code style="font-family:var(--font-mono)">--tracking-code</code> (0.2em) because they are read as letters, not as a word.</p>
</body></html>
