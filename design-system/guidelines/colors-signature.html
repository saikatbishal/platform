<!-- @dsCard group="Colors" viewport="700x170" name="Signature colours" subtitle="Cream, vermillion, oxide, steel — one job each" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body><div class="sw">
<div style="background:var(--cream)"><span class="n" style="color:#12283F">cream · numerals</span><span class="h" style="color:#12283F">#EECB9A</span></div>
<div style="background:var(--vermillion)"><span class="n" style="color:#12283F">vermillion · errors</span><span class="h" style="color:#12283F">#E85C50</span></div>
<div style="background:var(--oxide)"><span class="n" style="color:#12283F">oxide · planned</span><span class="h" style="color:#12283F">#C87352</span></div>
<div style="background:var(--steel)"><span class="n" style="color:#12283F">steel · disabled</span><span class="h" style="color:#12283F">#A3988F</span></div>
</div>
<p style="margin:10px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">Vermillion is not a second accent — errors and one “you are here” marker. The moment two things are red, neither is urgent.</p>
</body></html>
