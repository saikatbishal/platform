<!-- @dsCard group="Type" viewport="700x180" name="Body" subtitle="15px base, ×1.25 up; line-height falls as size rises" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body>
<p style="margin:0;font-size:var(--text-base);line-height:var(--leading-base);max-width:60ch">The map behind this board is a preview with sample journeys. Distances are great-circle, so they undercount — the UI says “as the crow flies” rather than hiding it.</p>
<p style="margin:10px 0 0;font-size:var(--text-sm);line-height:var(--leading-sm);color:var(--ink-soft)">13px — secondary copy, list rows, field hints.</p>
<p style="margin:6px 0 0;font-size:var(--text-xs);line-height:var(--leading-xs);color:var(--ink-faint)">12px — the smallest running text. Below this, only tracked uppercase labels.</p>
</body></html>
