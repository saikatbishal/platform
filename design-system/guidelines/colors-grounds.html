<!-- @dsCard group="Colors" viewport="700x150" name="Grounds & lines" subtitle="Dark is primary — the coach paint, unaltered" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body><div class="sw">
<div style="background:var(--ground)"><span class="n" style="color:var(--ink)">ground</span><span class="h" style="color:var(--ink)">#0A1C33</span></div>
<div style="background:var(--surface)"><span class="n" style="color:var(--ink)">surface</span><span class="h" style="color:var(--ink)">#0D2242</span></div>
<div style="background:var(--surface-2)"><span class="n" style="color:var(--ink)">surface-2</span><span class="h" style="color:var(--ink)">#153754</span></div>
<div style="background:var(--line)"><span class="n" style="color:var(--ink)">line</span><span class="h" style="color:var(--ink)">#1F4568</span></div>
<div style="background:var(--line-strong)"><span class="n" style="color:var(--ink)">line-strong</span><span class="h" style="color:var(--ink)">#2E5C82</span></div>
</div></body></html>
