<!-- @dsCard group="Colors" viewport="700x170" name="Accent" subtitle="Station-board yellow. A fill, never text on light." -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body><div class="sw">
<div style="background:var(--accent)"><span class="n" style="color:#12283F">accent</span><span class="h" style="color:#12283F">#EAB143</span></div>
<div style="background:var(--accent-wash)"><span class="n" style="color:var(--accent)">accent-wash</span><span class="h" style="color:var(--accent)">#332818</span></div>
<div style="background:var(--accent-dim)"><span class="n" style="color:#F7F3EA">accent-dim</span><span class="h" style="color:#F7F3EA">#8A6420</span></div>
</div>
<p style="margin:10px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">#EAB143 on white measures <b style="font-family:var(--font-mono)">2.0:1</b>. Navy on that same yellow measures <b style="font-family:var(--font-mono)">7.8:1</b> — that is how every station board in the country is built.</p>
</body></html>
