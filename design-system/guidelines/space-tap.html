<!-- @dsCard group="Spacing" viewport="700x150" name="Touch targets" subtitle="Mobile-first: 44px minimum, no exceptions" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body>
<div style="display:flex;gap:12px;align-items:center">
<div style="min-height:44px;display:flex;align-items:center;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);font-size:var(--text-label);font-weight:600;letter-spacing:var(--tracking-label);text-transform:uppercase">44px minimum</div>
<div style="height:44px;width:44px;border-radius:var(--radius-round);border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:var(--cream);font-weight:600">S</div>
<span style="font-size:12px;color:var(--ink-soft);max-width:34ch">The stat row doubles as its own expand control so the whole row is one thumb-sized target, not a tiny chevron.</span>
</div></body></html>
