<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}

.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}

<div class="b">

<div><div class="i"><img src="../assets/apple-touch-icon.png" width="56" height="56" alt="Apple touch icon"></div><div class="c">apple-touch-icon</div></div>
<div><div class="i"><img src="../assets/pwa-maskable-512.png" width="56" height="56" alt="Maskable PWA icon"></div><div class="c">maskable-512</div></div>
