<!-- @dsCard group="Spacing" viewport="700x170" name="Shadow" subtitle="Two only: painted-object offset, and the sheet's drop" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
.b{display:flex;gap:26px;align-items:center;padding:8px 0}</style></head><body>
<div class="b">
<div style="width:170px;height:62px;border-radius:var(--radius-hair);background:var(--board);box-shadow:var(--shadow-board);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--board-ink)">--shadow-board</div>
<div style="width:170px;height:62px;border-radius:var(--radius-sheet);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sheet);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)">--shadow-sheet</div>
</div>
<p style="margin:10px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">A hard 2px offset with no blur: a painted object sitting proud of its bracket, not a floating card. Cards themselves have no shadow at all — a hairline <code style="font-family:var(--font-mono)">--line</code> does the separating.</p>
</body></html>
