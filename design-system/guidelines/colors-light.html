<!-- @dsCard group="Colors" viewport="700x170" name="Light theme" subtitle="Not an inversion — the whitewashed platform stripe" -->
<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body)}
.sw{display:flex;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em}.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}</style></head><body>
<div class="sw">
<div style="background:var(--ground)"><span class="n" style="color:#12283F">ground</span><span class="h" style="color:#12283F">#F4F1EA</span></div>
<div style="background:var(--surface-2)"><span class="n" style="color:#12283F">surface-2</span><span class="h" style="color:#12283F">#EAE5DA</span></div>
<div style="background:var(--accent)"><span class="n" style="color:#F4F1EA">accent · text</span><span class="h" style="color:#F4F1EA">#8A5A0F</span></div>
<div style="background:var(--accent-fill)"><span class="n" style="color:#12283F">accent-fill</span><span class="h" style="color:#12283F">#EAB143</span></div>
<div style="background:var(--cream)"><span class="n" style="color:#F4F1EA">cream → bronze</span><span class="h" style="color:#F4F1EA">#8A6420</span></div>
<div style="background:var(--ink)"><span class="n" style="color:#F4F1EA">ink</span><span class="h" style="color:#F4F1EA">#12283F</span></div>
</div>
<p style="margin:10px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">A yellow bright enough to glow on navy is invisible on paper, so it splits: <code style="font-family:var(--font-mono)">accent</code> darkens to a readable bronze and <code style="font-family:var(--font-mono)">accent-fill</code> keeps the true board yellow for fills only.</p>
</body></html>
