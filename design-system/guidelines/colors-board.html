<!-- @dsCard group="Colors" viewport="700x170" name="Board paint" subtitle="Declared once at :root — identical in both themes" -->
<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--ground);font-family:var(--font-body);color:var(--ink)}
.sw{display:flex;gap:0;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line)}
.sw>div{flex:1;padding:10px 10px 12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:96px}
.n{font-size:11px;font-weight:600;letter-spacing:.06em;line-height:1.3}
.h{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
</style></head><body><div class="sw">
<div style="background:var(--board)"><span class="n" style="color:#12283F">board</span><span class="h" style="color:#12283F">#EAB143</span></div>
<div style="background:var(--board-ink)"><span class="n" style="color:#F7F3EA">board-ink</span><span class="h" style="color:#F7F3EA">#12283F</span></div>
<div style="background:var(--board-edge)"><span class="n" style="color:#12283F">board-edge</span><span class="h" style="color:#12283F">#F7F3EA</span></div>
<div style="background:var(--board-frame)"><span class="n" style="color:#F7F3EA">board-frame</span><span class="h" style="color:#F7F3EA">#6E645A</span></div>
</div>
<p style="margin:10px 0 0;font-size:12px;line-height:1.45;color:var(--ink-soft)">An Alwar Junction board is the same yellow at noon and at 2 a.m. These four are paint, not palette — the one exception to the both-themes rule.</p>
</body></html>
